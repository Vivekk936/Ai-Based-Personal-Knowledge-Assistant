    <!-- No webfont link on purpose. This app's whole promise is that nothing leaves the
         machine, and a Google Fonts request on every launch breaks that before the user
         has typed anything — it also stalls the first paint on an air-gapped box waiting
         for a DNS lookup that will never resolve. The font stack in index.css falls back
         to system-ui, which is Segoe UI Variable here. To have Plus Jakarta Sans back,
         vendor the .woff2 files into the bundle and @font-face them locally. -->
