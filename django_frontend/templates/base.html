<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Ada — Local Document Intelligence{% endblock %}</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
            },
            dark: {
              800: '#1e293b',
              850: '#172033',
              900: '#0f172a',
              950: '#090d16',
            }
          }
        }
      }
    }
  </script>
  <!-- Marked.js for markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .prose code { background-color: #334155; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-size: 0.85em; }
    .prose pre { background-color: #0f172a; padding: 0.75rem; border-radius: 0.5rem; overflow-x: auto; }
    .prose table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; margin-bottom: 0.5rem; }
    .prose th, .prose td { border: 1px solid #334155; padding: 0.35rem 0.6rem; font-size: 0.85em; }
    .prose th { background: #1e293b; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-dark-950 text-slate-100 min-h-screen flex antialiased font-sans select-none">

  <!-- Left Sidebar -->
  <aside class="w-64 bg-dark-900 border-r border-slate-800 flex flex-col justify-between shrink-0 h-screen sticky top-0">
    <!-- Top Branding & Navigation -->
    <div class="flex flex-col h-full overflow-hidden">
      <!-- App Header -->
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2.5 font-bold tracking-tight text-lg text-slate-100 hover:text-white">
          <span class="text-2xl">🧠</span>
          <span>Ada</span>
          <span class="text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800/60 font-medium">Django</span>
        </a>
        <div id="backend-status-pill" class="flex items-center gap-1.5 text-xs text-slate-400" title="Checking backend health...">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse" id="status-dot"></span>
        </div>
      </div>

      <!-- Main Navigation Links -->
      <div class="p-3 border-b border-slate-800 space-y-1">
        <a href="/" class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium transition-colors {% if request.resolver_match.url_name == 'index' %}bg-slate-800 text-white border border-slate-700{% else %}text-slate-400 hover:bg-slate-800/50 hover:text-slate-200{% endif %}">
          <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
          <span>Chat & Assist</span>
        </a>
        <a href="/organize/" class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium transition-colors {% if request.resolver_match.url_name == 'organize' %}bg-slate-800 text-white border border-slate-700{% else %}text-slate-400 hover:bg-slate-800/50 hover:text-slate-200{% endif %}">
          <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          <span>File Organizer</span>
        </a>
        <a href="/eval/" class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm font-medium transition-colors {% if request.resolver_match.url_name == 'eval' %}bg-slate-800 text-white border border-slate-700{% else %}text-slate-400 hover:bg-slate-800/50 hover:text-slate-200{% endif %}">
          <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          <span>RAG Evaluation</span>
        </a>
      </div>

      <!-- Chat Sessions List (Shown on Chat page or accessible globally) -->
      <div class="flex-1 overflow-y-auto p-3 space-y-1">
        <div class="flex items-center justify-between text-xs font-semibold text-slate-400 px-2 mb-2">
          <span>RECENT CHATS</span>
          <button onclick="createNewSession()" class="text-xs text-emerald-400 hover:text-emerald-300 font-medium flex items-center gap-1">
            + New
          </button>
        </div>
        <div id="sessions-container" class="space-y-1 text-sm">
          <div class="text-xs text-slate-500 px-2 py-3 text-center">Loading chats...</div>
        </div>
      </div>

      <!-- Uploaded Documents & Indexer Status -->
      <div class="p-3 border-t border-slate-800 bg-dark-850/60 flex flex-col max-h-56">
        <div class="flex items-center justify-between text-xs font-semibold text-slate-400 mb-2 shrink-0">
          <span class="flex items-center gap-1.5">
            <span>DOCUMENTS</span>
            <span id="uploads-count-badge" class="px-1.5 py-0.2 rounded-full text-[10px] bg-slate-800 text-slate-400 font-mono">0</span>
          </span>
          <label class="cursor-pointer text-xs text-emerald-400 hover:text-emerald-300 font-medium flex items-center gap-1" title="Upload PDFs, Office documents, spreadsheets, text">
            <span>+ Upload</span>
            <input type="file" multiple id="sidebar-file-input" accept=".pdf,.docx,.xlsx,.txt,.csv,.md,.json,.html" class="hidden" onchange="sidebarUploadFiles(event)">
          </label>
        </div>

        <!-- Scrollable Document List -->
        <div id="uploads-list" class="space-y-1 text-xs overflow-y-auto flex-1 mb-2 text-slate-300 pr-1">
          <div class="text-slate-500 italic text-[11px] py-2 text-center">No documents uploaded.<br>Click <strong class="text-emerald-400">+ Upload</strong> to import PDFs & files.</div>
        </div>

        <!-- Progress bar / index status -->
        <div id="index-status-bar" class="shrink-0 text-[11px] text-slate-400 bg-dark-900 px-2.5 py-1.5 rounded border border-slate-800 flex items-center justify-between">
          <span id="indexer-text">Checking status...</span>
          <span id="indexer-badge" class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden bg-dark-950">
    {% block content %}{% endblock %}
  </main>

  <!-- Global scripts -->
  <script>
    const BACKEND_URL = "{{ backend_url }}";

    // Health check
    async function checkHealth() {
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        const dot = document.getElementById('status-dot');
        const pill = document.getElementById('backend-status-pill');
        if (data.status === 'ok') {
          dot.className = 'w-2 h-2 rounded-full bg-emerald-400';
          pill.title = `Model: ${data.chat_model} | Embed: ${data.embed_model}`;
        } else {
          dot.className = 'w-2 h-2 rounded-full bg-amber-400';
          pill.title = data.detail || 'Degraded / connecting to models';
        }
      } catch (e) {
        const dot = document.getElementById('status-dot');
        dot.className = 'w-2 h-2 rounded-full bg-rose-500';
        document.getElementById('backend-status-pill').title = 'FastAPI backend offline';
      }
    }

    // File icons helper
    function getFileIcon(ext) {
      ext = (ext || '').toLowerCase().replace('.', '');
      if (ext === 'pdf') return '📄';
      if (['xlsx', 'xls', 'csv'].includes(ext)) return '📊';
      if (['docx', 'doc', 'txt', 'md'].includes(ext)) return '📝';
      if (['pptx', 'ppt'].includes(ext)) return '📽️';
      if (['py', 'js', 'html', 'css', 'json'].includes(ext)) return '💻';
      return '📁';
    }

    // Load uploaded files & index status
    async function loadUploadedFiles() {
      try {
        const res = await fetch('/api/ingest');
        const data = await res.json();
        const container = document.getElementById('uploads-list');
        const badge = document.getElementById('uploads-count-badge');
        const uploads = data.uploads || [];
        if (badge) badge.innerText = uploads.length;

        if (uploads.length > 0) {
          container.innerHTML = uploads.map(u => {
            const icon = getFileIcon(u.ext);
            const name = u.filename || u.path.split(/[\/\\]/).pop();
            const pagesText = u.pages > 0 ? `${u.pages}p` : '';
            const chunksText = u.chunks > 0 ? `${u.chunks}c` : '';
            const sub = [pagesText, chunksText].filter(Boolean).join(' • ');
            return `
              <div class="flex items-center justify-between group py-1 px-1.5 rounded hover:bg-slate-800/60 transition-colors" title="${u.path}">
                <div class="flex items-center gap-1.5 min-w-0 pr-1">
                  <span class="text-xs shrink-0">${icon}</span>
                  <span class="truncate text-slate-300 text-xs">${name}</span>
                  ${sub ? `<span class="text-[9px] text-slate-500 shrink-0 font-mono">${sub}</span>` : ''}
                </div>
                <button onclick="deleteUploadedFile('${encodeURIComponent(u.filename)}')" class="text-slate-500 hover:text-rose-400 opacity-0 group-hover:opacity-100 text-xs px-1" title="Delete & unindex">✕</button>
              </div>
            `;
          }).join('');
        } else {
          container.innerHTML = '<div class="text-slate-500 italic text-[11px] py-2 text-center">No documents uploaded.<br>Click <strong class="text-emerald-400">+ Upload</strong> to import PDFs & files.</div>';
        }

        await refreshIndexStatus();
      } catch (e) {}
    }

    async function refreshIndexStatus() {
      try {
        const res = await fetch('/api/index/status');
        const idx = await res.json();
        if (idx) {
          const txt = document.getElementById('indexer-text');
          const badge = document.getElementById('indexer-badge');
          if (idx.running && idx.pending > 0) {
            txt.innerText = `Indexing: ${idx.pending} pending`;
            badge.className = 'w-1.5 h-1.5 rounded-full bg-amber-400 animate-ping';
          } else {
            txt.innerText = `${idx.indexed || 0} files indexed (${idx.chunks || 0} chunks)`;
            badge.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500';
          }
        }
      } catch (e) {}
    }

    async function sidebarUploadFiles(e) {
      const files = e.target.files;
      if (!files || files.length === 0) return;
      const form = new FormData();
      for (let i = 0; i < files.length; i++) {
        form.append('files', files[i]);
      }

      const txt = document.getElementById('indexer-text');
      const badge = document.getElementById('indexer-badge');
      txt.innerText = `Indexing ${files.length} file(s)...`;
      badge.className = 'w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse';

      try {
        const res = await fetch('/api/ingest', { method: 'POST', body: form });
        const data = await res.json();
        await loadUploadedFiles();
        window.dispatchEvent(new CustomEvent('documentsChanged', { detail: data }));
      } catch (err) {
        alert('Upload failed: ' + err);
      } finally {
        e.target.value = '';
        await refreshIndexStatus();
      }
    }

    async function deleteUploadedFile(encodedFilename) {
      const fn = decodeURIComponent(encodedFilename);
      if (!confirm(`Delete and unindex "${fn}"?`)) return;
      try {
        await fetch(`/api/ingest/${encodedFilename}`, { method: 'DELETE' });
        await loadUploadedFiles();
        window.dispatchEvent(new CustomEvent('documentsChanged', { detail: { deleted: fn } }));
      } catch (e) {
        alert('Delete error: ' + e);
      }
    }

    // Sessions management
    let activeSessionId = localStorage.getItem('ada_active_session') || null;

    async function loadSessions() {
      try {
        const res = await fetch('/api/sessions');
        const data = await res.json();
        const container = document.getElementById('sessions-container');
        if (!data.sessions || data.sessions.length === 0) {
          container.innerHTML = '<div class="text-xs text-slate-500 px-2 py-3">No conversations yet.</div>';
          return;
        }

        if (!activeSessionId && data.sessions.length > 0) {
          activeSessionId = data.sessions[0].id;
          localStorage.setItem('ada_active_session', activeSessionId);
        }

        container.innerHTML = data.sessions.map(s => {
          const isActive = s.id === activeSessionId;
          const bg = isActive ? 'bg-slate-800 text-white font-medium border border-slate-700' : 'text-slate-400 hover:bg-slate-800/40 hover:text-slate-200';
          return `
            <div class="flex items-center justify-between rounded px-2.5 py-1.5 cursor-pointer group ${bg}" onclick="switchSession('${s.id}')">
              <span class="truncate text-xs">${s.title || 'Untitled Chat'}</span>
              <button onclick="event.stopPropagation(); deleteSession('${s.id}')" class="text-slate-500 hover:text-rose-400 opacity-0 group-hover:opacity-100 text-[10px] pl-1">✕</button>
            </div>
          `;
        }).join('');
      } catch (e) {}
    }

    async function createNewSession() {
      try {
        const res = await fetch('/api/sessions', { method: 'POST' });
        const s = await res.json();
        activeSessionId = s.id;
        localStorage.setItem('ada_active_session', s.id);
        await loadSessions();
        if (window.onSessionSwitched) window.onSessionSwitched(s.id);
      } catch (e) {
        alert('Failed to create session: ' + e);
      }
    }

    async function deleteSession(id) {
      if (!confirm('Delete this chat?')) return;
      try {
        await fetch(`/api/sessions/${id}`, { method: 'DELETE' });
        if (activeSessionId === id) {
          activeSessionId = null;
          localStorage.removeItem('ada_active_session');
        }
        await loadSessions();
        if (window.onSessionSwitched) window.onSessionSwitched(activeSessionId);
      } catch (e) {}
    }

    function switchSession(id) {
      activeSessionId = id;
      localStorage.setItem('ada_active_session', id);
      loadSessions();
      if (window.onSessionSwitched) window.onSessionSwitched(id);
    }

    // Init
    checkHealth();
    loadUploadedFiles();
    loadSessions();
    setInterval(checkHealth, 30000);
    setInterval(loadUploadedFiles, 10000);
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
