<!-- Sidebar Navigation Component -->
<aside class="sidebar">
  <!-- Brand Header -->
  <div class="brand-block">
    <div class="brand-icon">A</div>
    <div class="brand-text">
      <h1>Ada</h1>
      <p>your documents, searchable</p>
    </div>
  </div>

  <!-- Primary Navigation Actions -->
  <div class="nav-actions">
    <button class="btn-new-chat" onclick="Ada.createSession()">
      <span style="font-size: 16px; line-height: 1;">+</span> New chat
    </button>
    <a href="{% url 'organizer' %}" class="nav-link {% if active_tab == 'organizer' %}active{% endif %}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
      </svg>
      Organize files
    </a>
    <a href="{% url 'evaluation' %}" class="nav-link {% if active_tab == 'evaluation' %}active{% endif %}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
      RAG Benchmark
    </a>
  </div>

  <!-- Chats Section -->
  <div class="sidebar-section-header">Chats</div>
  <div class="sessions-list">
    {% for s in sessions %}
      <a href="{% url 'chat_session' session_id=s.id %}" class="session-item {% if active_tab == 'chat' and s.id == active_session_id %}active{% endif %}">
        <span class="session-title" title="{{ s.title }}">{{ s.title }}</span>
        <div class="session-actions">
          <button type="button" class="btn-icon-sm" title="Rename" onclick="Ada.renameSession('{{ s.id }}', '{{ s.title|escapejs }}', event)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
          </button>
          <button type="button" class="btn-icon-sm" title="Delete" onclick="Ada.deleteSession('{{ s.id }}', event)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      </a>
    {% empty %}
      <div style="font-size: 12px; color: var(--text-subtle); padding: 8px 10px;">
        No chats yet — start one above.
      </div>
    {% endfor %}
  </div>
</aside>
